name: Deploy to self-hosted (hikoya.org)

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Write production env
        run: |
          cat > .env.production.local <<EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=${{ secrets.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
          TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_SUPPORT_GROUP_CHAT_ID=${{ secrets.TELEGRAM_SUPPORT_GROUP_CHAT_ID }}
          TELEGRAM_PAYMENTS_CHAT_ID=${{ secrets.TELEGRAM_PAYMENTS_CHAT_ID }}
          TELEGRAM_DONATIONS_CHAT_ID=${{ secrets.TELEGRAM_DONATIONS_CHAT_ID }}
          NEXT_PUBLIC_SITE_URL=https://hikoya.org
          NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          GA4_PROPERTY_ID=${{ secrets.GA4_PROPERTY_ID }}
          GA4_CLIENT_EMAIL=${{ secrets.GA4_CLIENT_EMAIL }}
          GA4_PRIVATE_KEY=${{ secrets.GA4_PRIVATE_KEY }}
          EOF

      - name: Build
        env:
          # Stable across builds so Server Actions from a page loaded just
          # before a deploy don't break with "Failed to find Server Action"
          # once the new build (and its own random key, otherwise) is live.
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: npm run build

      - name: Assemble deploy package
        run: |
          mkdir -p deploy-stage
          cp -r .next deploy-stage/.next
          rm -rf deploy-stage/.next/cache
          cp -r public deploy-stage/public
          cp server.js deploy-stage/server.js
          cp .env.production.local deploy-stage/.env.production.local
          node -e "
            const pkg = require('./package.json');
            const fs = require('fs');
            fs.writeFileSync('deploy-stage/package.json', JSON.stringify({
              name: pkg.name,
              version: pkg.version,
              private: true,
              main: 'server.js',
              scripts: { start: 'node server.js' },
              dependencies: pkg.dependencies,
            }, null, 2));
          "

      # The server pulls the build itself. FTP on this host is unusable (it
      # resets the data socket on nearly every transfer), and the account has
      # no SSH — so instead of pushing files, we publish the build to a
      # rolling GitHub Release ("deploy-latest") and a cron job on the server
      # fetches and extracts it. The repo is public, so the release asset URLs
      # need no token on the server side.
      #
      # .env.production.local is stripped before zipping — it already lives on
      # the server and must never enter a public artifact. The server extracts
      # with overwrite-merge (never delete), so public/uploads/* and the
      # server's own .env are left untouched, and old hashed .next chunks are
      # kept for anyone with a stale page open (bfcache safety).
      #
      # BUILD_SHA.txt is the change gate: the cron downloads this tiny file and
      # only pulls the (large) zip when its SHA differs from what it last
      # deployed. The zip is uploaded BEFORE BUILD_SHA.txt so the gate can
      # never point at a build that isn't fully uploaded yet.
      - name: Package build for deploy
        run: |
          rm -f deploy-stage/.env.production.local
          # Source maps aren't needed to run the site and roughly double the
          # archive size, so drop them.
          find deploy-stage -name '*.map' -delete
          ( cd deploy-stage && zip -rq ../hikoya-build.zip . )
          echo "${{ github.sha }}" > BUILD_SHA.txt
          ls -lh hikoya-build.zip

      - name: Publish build to rolling release (server cron pulls this)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=deploy-latest
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --latest=false \
              --title "Latest build (auto)" \
              --notes "Rolling build the server cron deploy pulls. Replaced on every push to main."
          # zip first, then the SHA gate, so the gate never leads the payload.
          gh release upload "$TAG" hikoya-build.zip BUILD_SHA.txt --clobber

      - name: Upload build artifact (manual fallback)
        uses: actions/upload-artifact@v4
        with:
          name: hikoya-build
          path: hikoya-build.zip
          retention-days: 7

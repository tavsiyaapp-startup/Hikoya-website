name: Deploy to self-hosted (hikoya.org)

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Write production env
        run: |
          cat > .env.production.local <<EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=${{ secrets.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
          TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_SUPPORT_GROUP_CHAT_ID=${{ secrets.TELEGRAM_SUPPORT_GROUP_CHAT_ID }}
          NEXT_PUBLIC_SITE_URL=https://hikoya.org
          NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          GA4_PROPERTY_ID=${{ secrets.GA4_PROPERTY_ID }}
          GA4_CLIENT_EMAIL=${{ secrets.GA4_CLIENT_EMAIL }}
          GA4_PRIVATE_KEY=${{ secrets.GA4_PRIVATE_KEY }}
          EOF

      - name: Build
        env:
          # Stable across builds so Server Actions from a page loaded just
          # before a deploy don't break with "Failed to find Server Action"
          # once the new build (and its own random key, otherwise) is live.
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: npm run build

      - name: Assemble deploy package
        run: |
          mkdir -p deploy-stage
          cp -r .next deploy-stage/.next
          rm -rf deploy-stage/.next/cache
          cp -r public deploy-stage/public
          cp server.js deploy-stage/server.js
          cp .env.production.local deploy-stage/.env.production.local
          node -e "
            const pkg = require('./package.json');
            const fs = require('fs');
            fs.writeFileSync('deploy-stage/package.json', JSON.stringify({
              name: pkg.name,
              version: pkg.version,
              private: true,
              main: 'server.js',
              scripts: { start: 'node server.js' },
              dependencies: pkg.dependencies,
            }, null, 2));
          "

      # Uploaded separately, with a state file unique to this run (never
      # reused), so this action never sees these as "previously deployed"
      # and never deletes any of them — only adds. Without this, its normal
      # diff-sync deletes any chunk whose content-hashed filename changed
      # since the last deploy, which breaks CSS/JS for anyone who still has
      # an older page open (or a bfcache/back-forward restore) referencing
      # the now-removed old hash — the actual cause of "some users get the
      # site with no styling at all" after a run of frequent deploys.
      #
      # run_id-run_attempt (not just github.sha) — an FTP ECONNRESET mid-
      # upload happens often on this host, and `gh run rerun --failed`
      # reruns the same commit, so a sha-only key would make the retry
      # reuse the previous attempt's state file and trust it as already
      # uploaded for files whose transfer never actually completed,
      # silently leaving them missing on the server (found live: several
      # chunks 404ing after a run of retried deploys). Keying by attempt
      # too means every retry starts with a clean slate.
      #
      # Both FTP steps below retry themselves up to 3 times in-job: the
      # host's FTP server resets the data socket (ECONNRESET) often enough
      # that nearly every deploy this project has done needed at least one
      # manual `gh run rerun --failed`. continue-on-error on the first two
      # attempts means a transient reset doesn't fail the job outright; the
      # final attempt has no continue-on-error, so three resets in a row
      # still fails the job loudly instead of silently leaving files
      # unuploaded. YAML anchors (&/*) keep the `with:` block defined once —
      # GitHub Actions has supported them since September 2025.
      - name: Upload static assets via FTP (additive only, never deletes)
        id: ftp-static-1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with: &ftp-static-config
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-stage/.next/static/
          server-dir: /www/hikoya.org/.next/static/
          state-name: .ftp-deploy-static-state-${{ github.run_id }}-${{ github.run_attempt }}.json

      - name: Retry static assets upload (attempt 2/3)
        id: ftp-static-2
        if: steps.ftp-static-1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with: *ftp-static-config

      - name: Retry static assets upload (attempt 3/3)
        if: steps.ftp-static-1.outcome == 'failure' && steps.ftp-static-2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with: *ftp-static-config

      - name: Upload via FTP
        id: ftp-main-1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with: &ftp-main-config
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-stage/
          server-dir: /www/hikoya.org/
          exclude: |
            **/node_modules/**
            .next/static/**

      - name: Retry main upload (attempt 2/3)
        id: ftp-main-2
        if: steps.ftp-main-1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with: *ftp-main-config

      - name: Retry main upload (attempt 3/3)
        if: steps.ftp-main-1.outcome == 'failure' && steps.ftp-main-2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with: *ftp-main-config

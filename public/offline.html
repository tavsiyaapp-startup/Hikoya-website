<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5535A6">
<title>Hikoya — internet yoʻq</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #F5F4F8; color: #1C1828; }
  @media (prefers-color-scheme: dark) { body { background: #14101F; color: #EDEAF6; } p { color: #A39CC0 !important; } }
  main { max-width: 360px; padding: 24px; text-align: center; }
  img { width: 88px; height: 88px; margin-bottom: 18px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 26px; margin: 0 0 10px; }
  p { margin: 0 0 6px; line-height: 1.55; color: #67627D; font-size: 15px; }
  button { margin-top: 18px; height: 46px; padding: 0 26px; border: 0; border-radius: 999px; background: #5535A6; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="Hikoya">
  <h1>Internet aloqasi yoʻq</h1>
  <p>Aloqa tiklangach, sahifani yangilang.</p>
  <p>Нет подключения к интернету. Обновите страницу, когда связь появится.</p>
  <button onclick="location.reload()">Yangilash · Обновить</button>
</main>
</body>
</html>

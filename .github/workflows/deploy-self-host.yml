name: Deploy to self-hosted (hikoya.org)

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Write production env
        run: |
          cat > .env.production.local <<EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=${{ secrets.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
          TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_SUPPORT_GROUP_CHAT_ID=${{ secrets.TELEGRAM_SUPPORT_GROUP_CHAT_ID }}
          TELEGRAM_PAYMENTS_CHAT_ID=${{ secrets.TELEGRAM_PAYMENTS_CHAT_ID }}
          TELEGRAM_DONATIONS_CHAT_ID=${{ secrets.TELEGRAM_DONATIONS_CHAT_ID }}
          NEXT_PUBLIC_SITE_URL=https://hikoya.org
          NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          GA4_PROPERTY_ID=${{ secrets.GA4_PROPERTY_ID }}
          GA4_CLIENT_EMAIL=${{ secrets.GA4_CLIENT_EMAIL }}
          GA4_PRIVATE_KEY=${{ secrets.GA4_PRIVATE_KEY }}
          EOF

      # TEMPORARY recovery step. The server's .env.production.local was lost
      # during the disk-quota cleanup, so the running app has no DATABASE_URL
      # (and no other secret) and every DB query fails with "DATABASE_URL is
      # not set". Publish the freshly-assembled env file once as its own
      # artifact so it can be restored by hand through the ISPmanager file
      # manager. include-hidden-files is required — upload-artifact@v4 skips
      # dotfiles by default. retention-days 1 keeps the secret-bearing artifact
      # around only long enough to download it. REMOVE this step, and delete
      # the hikoya-env artifact, once the file is back on the server.
      - name: Publish env for manual recovery (TEMPORARY — remove after)
        uses: actions/upload-artifact@v4
        with:
          name: hikoya-env
          path: .env.production.local
          include-hidden-files: true
          retention-days: 1

      - name: Build
        env:
          # Stable across builds so Server Actions from a page loaded just
          # before a deploy don't break with "Failed to find Server Action"
          # once the new build (and its own random key, otherwise) is live.
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: npm run build

      - name: Assemble deploy package
        run: |
          mkdir -p deploy-stage
          cp -r .next deploy-stage/.next
          rm -rf deploy-stage/.next/cache
          cp -r public deploy-stage/public
          cp server.js deploy-stage/server.js
          cp .env.production.local deploy-stage/.env.production.local
          node -e "
            const pkg = require('./package.json');
            const fs = require('fs');
            fs.writeFileSync('deploy-stage/package.json', JSON.stringify({
              name: pkg.name,
              version: pkg.version,
              private: true,
              main: 'server.js',
              scripts: { start: 'node server.js' },
              dependencies: pkg.dependencies,
            }, null, 2));
          "

      # Uploaded separately, with a state file unique to this run (never
      # reused), so this action never sees these as "previously deployed"
      # and never deletes any of them — only adds. Without this, its normal
      # diff-sync deletes any chunk whose content-hashed filename changed
      # since the last deploy, which breaks CSS/JS for anyone who still has
      # an older page open (or a bfcache/back-forward restore) referencing
      # the now-removed old hash — the actual cause of "some users get the
      # site with no styling at all" after a run of frequent deploys.
      #
      # run_id-run_attempt (not just github.sha) — an FTP ECONNRESET mid-
      # upload happens often on this host, and `gh run rerun --failed`
      # reruns the same commit, so a sha-only key would make the retry
      # reuse the previous attempt's state file and trust it as already
      # uploaded for files whose transfer never actually completed,
      # silently leaving them missing on the server (found live: several
      # chunks 404ing after a run of retried deploys). Keying by attempt
      # too means every retry starts with a clean slate.
      #
      # Both FTP steps below retry themselves up to 3 times in-job: the
      # host's FTP server resets the data socket (ECONNRESET) often enough
      # that nearly every deploy this project has done needed at least one
      # manual `gh run rerun --failed`. continue-on-error on the first two
      # attempts means a transient reset doesn't fail the job outright; the
      # final attempt has no continue-on-error, so three resets in a row
      # still fails the job loudly instead of silently leaving files
      # unuploaded. YAML anchors (&/*) keep the `with:` block defined once —
      # GitHub Actions has supported them since September 2025.
      # FTP bypass. This host's FTP is currently unusable for a full upload —
      # it resets the data socket on nearly every transfer, so even lftp with
      # retries/resume ran the full 6h job limit without finishing. Until FTP
      # is healthy again we publish the build as a downloadable artifact:
      # download hikoya-build.zip from this run and extract it into
      # /www/hikoya.org/ through the ISPmanager file manager (HTTP, not FTP),
      # then press Restart. .env.production.local is deleted before zipping so
      # no secrets enter the artifact — it already lives on the server and is
      # left untouched there.
      - name: Package build for manual upload (FTP bypass)
        run: |
          rm -f deploy-stage/.env.production.local
          # Source maps aren't needed to run the site and roughly double the
          # archive size, so drop them.
          find deploy-stage -name '*.map' -delete
          ( cd deploy-stage && zip -rq ../hikoya-build.zip . )
          ls -lh hikoya-build.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikoya-build
          path: hikoya-build.zip
          retention-days: 7
